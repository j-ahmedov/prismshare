[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-share"
version = "0.1.0"
description = "Measurement instrument for screen-to-camera optical data links (cimbar-class codes)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.8",
    "Pillow>=10.0",
    "reedsolo>=1.7",
    "pandas>=2.1",
    "pyarrow>=14",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["prism_share*"]

[tool.setuptools.package-data]
"prism_share.codec" = ["glyph_cache/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
